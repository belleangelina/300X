name: Android branch test build

on:
  workflow_dispatch:
  push:
    branches: [fix-catalog-scroll-jank-20261003]
    paths:
      - pubspec.yaml
      - .github/workflows/android-test-build.yml
      - integration_test/catalog_scroll_test.dart
      - lib/features/library/presentation/work_widgets.dart
      - test/features/library/presentation/work_cover_test.dart

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-validate:
    if: github.ref == 'refs/heads/fix-catalog-scroll-jank-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - run: mkdir -p .artifacts/validation/logs
      - name: Resolve dependencies and run regression tests
        run: |
          flutter pub get > .artifacts/validation/logs/pub-get.log 2>&1
          flutter analyze --no-pub integration_test/catalog_scroll_test.dart \
            lib/features/library/presentation/work_widgets.dart \
            test/features/library/presentation/work_cover_test.dart \
            > .artifacts/validation/logs/analyze.log 2>&1
          flutter test test/features/library/data/forum_library_repository_test.dart \
            test/features/library/data/work_aggregator_test.dart \
            test/features/library/presentation/library_home_page_test.dart \
            test/features/library/presentation/work_cover_test.dart \
            test/features/library/presentation/cover_load_interaction_boundary_test.dart \
            > .artifacts/validation/logs/regression.log 2>&1
      - name: Configure existing Android signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$KEYSTORE" && test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD" && test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/x300-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=x300-release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Build and verify versioned APKs
        id: build
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          bash build_release.sh --platform android --keep-version \
            > .artifacts/validation/logs/android-build.log 2>&1
          version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$EXPECTED_CERT_SHA256"
          for apk in build/releases/*.apk; do
            actual_cert=$(
              "$apksigner" verify --print-certs-pem "$apk" |
                openssl x509 -outform DER | sha256sum | awk '{ print $1 }'
            )
            test "${actual_cert,,}" = "${EXPECTED_CERT_SHA256,,}"
          done
          sha256sum build/releases/*.apk > build/releases/SHA256SUMS.txt
          printf 'Source commit: %s\nVersion: %s\nBranch: %s\n' \
            "$GITHUB_SHA" "$version" "$GITHUB_REF_NAME" > build/releases/BUILD.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android scroll regression and signed APK launch
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            flutter test --no-pub integration_test/catalog_scroll_test.dart -d emulator-5554 > .artifacts/validation/logs/android-integration.log 2>&1
            adb uninstall com.yamibox300 || true
            adb install build/releases/*-android-universal-release.apk > .artifacts/validation/logs/android-install.log 2>&1
            adb shell am start -W -n com.yamibox300/.MainActivity > .artifacts/validation/logs/android-launch.log 2>&1
            adb shell pidof com.yamibox300
      - name: Upload verified Android test package
        uses: actions/upload-artifact@v4
        with:
          name: X300-android-test-${{ steps.build.outputs.version }}
          path: build/releases/
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-validation-logs
          path: .artifacts/validation/logs/
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/x300-release.jks
