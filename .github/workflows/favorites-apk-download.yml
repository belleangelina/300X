name: Favorites APK download

on:
  push:
    branches: [feat/favorites-navigation]
    paths: [.github/workflows/favorites-apk-download.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Favorites Android test build run
        required: true
        default: '37187385742'
        type: string
      artifact_name:
        description: Verified Android package artifact
        required: true
        default: 'X300-favorites-android-test-1.0.11+15'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  export-universal-apk:
    if: github.ref == 'refs/heads/feat/favorites-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_RUN_ID: ${{ inputs.run_id || '37187385742' }}
      SOURCE_ARTIFACT: ${{ inputs.artifact_name || 'X300-favorites-android-test-1.0.11+15' }}
    steps:
      - name: Require a successful Android validation run
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.SOURCE_RUN_ID),
            });
            if (run.conclusion !== 'success' ||
                run.head_branch !== 'feat/favorites-navigation' ||
                run.path !== '.github/workflows/favorites-android-test-build.yml') {
              throw new Error('Source must be a successful favorites Android build');
            }
            core.setOutput('sha', run.head_sha);
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: verified-apks
      - name: Verify APK checksum and source
        id: package
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path('verified-apks')
          build = (root / 'BUILD.txt').read_text()
          assert f"Source commit: {os.environ['EXPECTED_SOURCE_SHA']}" in build
          for line in (root / 'SHA256SUMS.txt').read_text().splitlines():
              digest, filename = line.split(maxsplit=1)
              apk = root / Path(filename).name
              assert hashlib.sha256(apk.read_bytes()).hexdigest() == digest
          apks = list(root.glob('*-android-universal-release.apk'))
          assert len(apks) == 1
          version = next(line.removeprefix('Version: ') for line in build.splitlines() if line.startswith('Version: '))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          print(f'{apks[0].name}: {apks[0].stat().st_size} bytes, original checksum verified')
          PY
      - name: Upload directly downloadable universal APK
        uses: actions/upload-artifact@v4
        with:
          name: X300-favorites-universal-APK-${{ steps.package.outputs.version }}
          path: verified-apks/*-android-universal-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
