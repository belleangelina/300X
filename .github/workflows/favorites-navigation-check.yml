name: Favorites navigation checks

on:
  push:
    branches: [feat/favorites-navigation]
  pull_request:
    paths:
      - lib/features/favorites/**
      - lib/features/home/presentation/home_shell.dart
      - lib/features/profile/presentation/profile_page.dart
      - lib/shared/presentation/catalog_controls.dart
      - test/features/favorites/**
      - test/features/home/**
      - test/features/profile/**
      - integration_test/favorites_navigation_test.dart
      - .github/workflows/favorites-navigation-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: favorites-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - name: Prepare Linux runtime
        run: |
          mkdir -p .artifacts/validation/logs .artifacts/validation/screenshots
          sudo apt-get update > .artifacts/validation/logs/apt-update.log 2>&1
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libsecret-1-dev fonts-noto-cjk xvfb > .artifacts/validation/logs/apt-install.log 2>&1
          flutter config --enable-linux-desktop > .artifacts/validation/logs/flutter-config.log 2>&1
          flutter pub get > .artifacts/validation/logs/pub-get.log 2>&1
      - name: Format affected Dart files
        run: |
          dart format lib/features/favorites/presentation/cloud_favorites_page.dart lib/features/home/presentation/home_shell.dart lib/features/profile/presentation/profile_page.dart lib/features/library/presentation/library_home_page.dart lib/shared/presentation/catalog_controls.dart test/features/favorites/presentation/cloud_favorites_page_cache_test.dart test/features/favorites/presentation/favorites_navigation_test.dart test/features/home/presentation/home_shell_test.dart test/features/profile/presentation/profile_page_test.dart integration_test/favorites_navigation_test.dart > .artifacts/validation/logs/format.log 2>&1
          git diff > .artifacts/validation/format.patch
          test ! -s .artifacts/validation/format.patch
      - name: Analyze affected code
        run: |
          flutter analyze --no-pub lib/features/favorites/presentation lib/features/home/presentation/home_shell.dart lib/features/profile/presentation/profile_page.dart lib/features/library/presentation/library_home_page.dart lib/shared/presentation/catalog_controls.dart test/features/favorites/presentation test/features/home/presentation/home_shell_test.dart test/features/profile/presentation/profile_page_test.dart integration_test/favorites_navigation_test.dart > .artifacts/validation/logs/analyze.log 2>&1
      - name: Run related regressions
        run: |
          flutter test --no-pub test/features/favorites test/features/home/presentation/home_shell_test.dart test/features/profile/presentation/profile_page_test.dart test/features/library/presentation/library_home_page_test.dart test/shared/presentation/tab_app_bar_test.dart > .artifacts/validation/logs/regression.log 2>&1
      - name: Exercise real Linux navigation
        run: |
          xvfb-run -a flutter test --no-pub integration_test/favorites_navigation_test.dart -d linux > .artifacts/validation/logs/linux-integration.log 2>&1
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: favorites-navigation-validation
          path: .artifacts/validation/
          retention-days: 7
