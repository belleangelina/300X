name: One-time Dart formatting
on:
  push:
    branches: [work/20261002]
    paths: [.github/workflows/temporary-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Format and verify
        run: |
          mkdir -p .artifacts/validation/logs
          dart format lib test tool > .artifacts/validation/logs/format.log 2>&1
          tail -1 .artifacts/validation/logs/format.log
          dart format --output=none --set-exit-if-changed lib test tool > .artifacts/validation/logs/format-check.log 2>&1
          tail -1 .artifacts/validation/logs/format-check.log
          git diff --check
          git diff --stat
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/temporary-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format Dart code"
          git push origin HEAD:work/20261002
